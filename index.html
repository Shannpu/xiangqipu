<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>象棋杀棋练习</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b3f22">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    /* 与棋盘同源的木色系 */
    --wood-900:#4a3521;   /* 最深：主文字 */
    --wood-800:#5f4526;   /* 深：标题栏 */
    --wood-700:#7a5a32;   /* 中深：边框/次要文字 */
    --wood-500:#a87c4a;   /* 中：辅助线、按钮边 */
    --wood-300:#d8b788;   /* 浅：分隔 */
    --wood-100:#efe0c6;   /* 更浅：卡片底 */
    --paper:#f7ecd8;      /* 页面底色（与棋盘木色同调） */
    --panel:#fdf7ea;      /* 面板白（暖白） */
    --accent:#b5651d;     /* 主行动色：陶土棕 */
    --accent-dark:#96501a;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; padding:0;
    height:100%;
    overflow:hidden;              /* 整页不滚动，避免上下乱窜 */
    overscroll-behavior:none;     /* 禁掉下拉刷新/滚动链 */
    -webkit-overflow-scrolling:auto;
  }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--paper); color:var(--wood-900);
         display:flex; flex-direction:column;
         padding-top:var(--safe-t); padding-bottom:var(--safe-b);
         -webkit-user-select:none; user-select:none;
         touch-action:manipulation; }   /* 禁止双击缩放，保留点击 */
  header { background:linear-gradient(180deg,#6a4a29,#5b3f22); color:#f7e9cf; padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
           flex-shrink:0; position:relative; z-index:10; box-shadow:0 1px 4px rgba(74,53,33,.25); }
  header h1 { font-size:17px; margin:0; font-weight:600; letter-spacing:.5px; }
  header .solved { font-size:13px; opacity:.92; color:#e9cfa3; }
  .cats { display:flex; gap:8px; padding:10px 12px 0; overflow-x:auto; flex-shrink:0;
          scrollbar-width:none; touch-action:pan-x; }   /* 只允许横向滑动 */
  .cats::-webkit-scrollbar { display:none; }
  .cat { flex-shrink:0; padding:7px 14px; border-radius:18px; background:#eadbc0; font-size:14px; border:1px solid #dcc9a5; color:#6b5233; }
  .cat.active { background:linear-gradient(180deg,#8a6234,#75512a); color:#f8ecd6; border-color:#75512a; }
  .main { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
          overscroll-behavior:contain;   /* 内部滚动不外溢 */
          padding:10px 12px calc(20px + var(--safe-b)); max-width:520px; margin:0 auto; width:100%; }
  #boardWrap { width:100%; max-width:500px; margin:0 auto; touch-action:none; }  /* 棋盘区禁止滚动 */
  #board { width:100%; touch-action:none; }
  .toolbar { display:flex; gap:8px; margin-top:12px; }
  .toolbar button { flex:1; padding:11px 0; font-size:15px; border:1px solid #ddc9a4; border-radius:10px; background:var(--panel); color:#6b5233; box-shadow:0 1px 3px rgba(90,64,41,.10); }
  .toolbar button.primary { background:linear-gradient(180deg,#b5651d,#9c5316); border-color:#8e4c14; color:#fff6e8; }
  .status { text-align:center; margin-top:10px; font-size:14px; min-height:20px; color:#7a5a34; }
  .navrow { display:flex; align-items:center; justify-content:space-between; margin-top:14px; background:var(--panel); border:1px solid #e6d5b6; border-radius:12px; padding:10px 14px; box-shadow:0 1px 3px rgba(90,64,41,.08); }
  .navrow .title { font-size:15px; font-weight:600; color:#5f4526; }
  .navrow .idx { font-size:13px; color:#9c8460; }
  .navrow .jump { display:flex; gap:6px; }
  .navrow .jump button { padding:8px 14px; border:1px solid #ddc9a4; border-radius:8px; background:#f3e7cf; font-size:14px; color:#6b5233; }
  .numrow { display:flex; gap:6px; margin-top:10px; align-items:center; }
  .numrow input { width:90px; padding:8px; border:1px solid #ddc9a4; border-radius:8px; font-size:14px; background:var(--panel); color:#5f4526; }
  .numrow button { padding:8px 14px; border:1px solid #ddc9a4; border-radius:8px; background:#f3e7cf; font-size:14px; color:#6b5233; }
  /* 结算弹层 */
  #overlay { position:fixed; inset:0; background:rgba(58,40,24,.62); display:none; align-items:center; justify-content:center; z-index:50; touch-action:none; }
  #overlay.show { display:flex; }
  .card { background:var(--panel); border:1px solid #e2cfa9; border-radius:16px; padding:28px 30px; text-align:center; max-width:300px; width:80%; box-shadow:0 8px 28px rgba(58,40,24,.28); }
  .card h2 { margin:0 0 8px; font-size:22px; color:#5f4526; }
  .card p { margin:0 0 18px; font-size:14px; color:#7a5a34; }
  .card button { width:100%; padding:11px 0; margin-top:8px; border-radius:10px; font-size:15px; border:1px solid #ddc9a4; }
  .card .again { background:#f3e7cf; color:#6b5233; }
  .card .next { background:linear-gradient(180deg,#b5651d,#9c5316); border-color:#8e4c14; color:#fff6e8; }
  .spin { display:none; position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:rgba(0,0,0,.6); color:#fff; padding:6px 14px; border-radius:14px; font-size:13px; z-index:40; }
  /* 点击走子的选中标记 */
  /* ===== 自绘棋盘样式 ===== */
  .xq-board-root { width:100%; display:flex; justify-content:center; }
  .xq-board-inner { position:relative; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  .xq-canvas { display:block; border-radius:8px; box-shadow:0 3px 12px rgba(0,0,0,.18); }
  .xq-pieces, .xq-marks { position:absolute; left:0; top:0; }
  .xq-marks { pointer-events:none; }
  .xq-piece {
    position:absolute; background-size:100% 100%; background-repeat:no-repeat;
    transition:left .16s ease, top .16s ease; will-change:left,top;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));
  }
  .xq-piece.sel { transform:scale(1.08); filter:drop-shadow(0 0 6px rgba(255,193,7,.95)) drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  /* 上一手：起点小橙点，落点橙色圆环套住棋子 */
  .xq-marks { z-index:3; }
  .xq-last-from {
    position:absolute; border-radius:50%;
    background:#ef5b23;
    box-shadow:0 0 0 2px rgba(255,255,255,.5), 0 1px 3px rgba(120,40,10,.4);
  }
  .xq-last-to {
    position:absolute; border-radius:50%;
    border:3px solid #ef5b23;
    box-shadow:0 0 0 1px rgba(255,255,255,.35), 0 0 8px rgba(239,91,35,.45);
    background:transparent;
  }
  .xq-dot { position:absolute; border-radius:50%; background:rgba(30,120,60,.72); box-shadow:0 0 0 2px rgba(255,255,255,.55); }
  .xq-check { position:absolute; border-radius:50%; box-shadow:0 0 0 3px rgba(200,40,40,.92), 0 0 14px rgba(200,40,40,.72); animation:xqPulse 1s infinite; }
  @keyframes xqPulse { 0%,100% { opacity:1 } 50% { opacity:.45 } }
</style>
</head>
<body>
<header>
  <h1>象棋杀棋练习</h1>
  <div class="solved">已解 <span id="solvedCount">0</span> 题</div>
</header>

<div class="cats" id="cats"></div>

<div class="main">
  <div id="boardWrap"><div id="board"></div></div>

  <div class="status" id="status">轮到你走（红方）</div>

  <div class="toolbar">
    <button id="btnRetry">重来</button>
    <button id="btnUndo">悔棋</button>
    <button id="btnNext" class="primary">换一题</button>
  </div>

  <div class="navrow">
    <div>
      <div class="title" id="catTitle"></div>
      <div class="idx" id="puzIdx"></div>
    </div>
    <div class="jump">
      <button id="btnPrev">上一题</button>
      <button id="btnRandom">随机</button>
    </div>
  </div>

  <div class="numrow">
    <input id="jumpNum" type="number" min="1" placeholder="题号">
    <button id="btnJump">跳到该题</button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <h2 id="ovTitle"></h2>
    <p id="ovText"></p>
    <button class="again" id="ovAgain">再试一次</button>
    <button class="next" id="ovNext">下一题</button>
  </div>
</div>

<div class="spin" id="spin">黑方思考中…</div>

<script src="lib/jquery.min.js"></script>
<script src="lib/xiangqi.min.js"></script>
<script src="engine/cchess.js"></script>
<script src="engine/position.js"></script>
<script src="engine/search.js"></script>
<script src="engine/book.js"></script>
<script src="js/board.js?v=11"></script>
<script src="js/app.js?v=11"></script>
</body>
</html>
